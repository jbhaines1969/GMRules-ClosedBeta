setup.info.specifics.title=Using Game Setup
setup.info.specifics.name=Game Name is the required identity for this ruleset. Saving a nonblank name completes Game Setup, unlocks the Rules Builder navigation, and gives exported .gmrf files a recognizable filename.
setup.info.specifics.description=Game Description is the broad introduction to your game. Use it to explain the setting, premise, intended style of play, and anything a new player should understand before creating a character. Descendant applications can present this creator-written text when introducing the ruleset.
setup.info.specifics.type=Game Type classifies the ruleset by its general genre or style. Choose the closest available option; it is descriptive metadata and does not force the game to use particular mechanics.
setup.info.specifics.save=Continue saves all three fields to the active draft before moving to Weights & Measures. You can return and revise them later, and you can download the current .gmrf from the top bar whenever you want a portable copy.
measurements.info.specifics.title=Using Weights & Measures
measurements.info.specifics.weight=Weight System selects the default convention used when the suite presents weights and measurements. Choose Metric or Imperial (US Customary) according to the language of your rules; individual descriptions can still mention whatever units your game requires.
measurements.info.specifics.time_unit=Each Time Unit gives a game term a duration. Enter its name, the number in Amount, and the existing Unit that amount is measured in. For example, a round could be 6 seconds, while a turn could be 10 rounds.
measurements.info.specifics.relationships=Time units may be built from smaller units, allowing the ruleset to preserve relationships between seconds, rounds, turns, watches, days, or setting-specific periods. Add smaller base units before defining larger units that depend on them.
measurements.info.specifics.manage=The list shows the units currently available to the ruleset. Add Time Unit opens a blank editor, Edit opens that editor for an existing unit, and Remove deletes one you do not use. Include only the units that help descendant applications describe durations or schedule game events.
dice.info.specifics.title=Using Dice Options
dice.info.specifics.standard=Standard Dice identifies the physical or digital dice used anywhere in your game. Select every die size that later rules may reference. These choices make dice available to the ruleset; they do not by themselves create a roll or determine when a die is used.
dice.info.specifics.custom=Custom Ranges represent random values that are not covered by the standard dice list. Add Range opens an editor for the inclusive minimum and maximum result. This can support unusual dice, tables, cards, spinners, or digital randomizers whose results follow a custom numeric span.
dice.info.specifics.use=Later mechanics can combine the available dice and ranges into procedures such as Attribute generation, damage, healing, or random selections. Select a die or range here because the rules use it somewhere, not merely because it is common in other games.
dice.info.specifics.manage=Checkbox changes are saved immediately. Custom ranges remain in the list until removed. Removing an option means it should no longer be offered for future rule configuration, so review any mechanics that depended on it.
attrtypes.info.specifics.title=Using Attribute Categories
attrtypes.info.specifics.optional=Attribute Categories are optional organizational groups. Create them only when the grouping communicates something useful about the rules, such as Physical, Mental, and Social Attributes. A game whose Attributes stand on their own can leave this list empty.
attrtypes.info.specifics.entries=Add Category opens an editor for the category's name and description. The name is shown while organizing Attributes, and the description can explain what the group represents in your game. Edit revises either value; Remove deletes the category.
attrtypes.info.specifics.assignment=Categories do not contain scores or generation rules. After creating them, assign each relevant Attribute to a category on the Attributes screen. Attributes may also remain uncategorized.
attrtypes.info.specifics.system_name=The optional system name changes what this collection is called throughout the builder and ruleset. Use it when your game uses a more fitting term than Attribute Categories, while keeping the underlying data compatible with the rest of the suite.
attributes.info.specifics.title=Using Attributes
attributes.info.specifics.entries=Add Attribute creates one of the broad character capabilities used by your game. Give it a clear name and a creator-written description explaining what the Attribute represents, what kinds of actions it influences, and how players should interpret its score.
attributes.info.specifics.category=Attribute Category assigns the Attribute to one of the optional groups created on the previous screen. You can change that assignment directly from the list without recreating the Attribute, or leave it set to None.
attributes.info.specifics.range=Minimum and Maximum define the legal score range for this Attribute when the game does not use the shared limits from Attribute Generation. When shared limits are enabled, those common values are used instead and the individual range fields are hidden.
attributes.info.specifics.modifiers=Modifiers translate particular scores into bonuses or penalties used by other rules. Define an individual score-to-modifier list when this Attribute follows its own progression. If Attribute Generation applies one modifier list to every Attribute, the shared list is used instead.
attributes.info.specifics.bonuses=Score Bonuses record additional effects that become available at specified thresholds. Use them for rules that grant a named benefit when this Attribute reaches a particular score; leave the list empty when the Attribute has no threshold-based benefits.
attributes.info.specifics.manage=Edit reopens the complete Attribute definition, Change Category only changes its organizational group, and Remove deletes it. Because later rules may refer to an Attribute, review those relationships before removing one from an established ruleset.
attrgen.standard.info.specifics.title=Using Standard Array/Base Scores
attrgen.standard.info.specifics.enabled=This screen is active when at least one Player Option uses Standard Array. If no option uses it, the controls remain locked so unused array data cannot accidentally affect character generation.
attrgen.standard.info.specifics.assignment=Array Assignment determines how values reach Attributes. Auto Assigned pairs every value with a specific Attribute, producing a fixed distribution. Player Assigned stores only the numbers and lets each player decide which Attribute receives each value.
attrgen.standard.info.specifics.standard=Standard Arrays contain the ordinary set of starting values. In assigned mode, select an Attribute and add its value; in open mode, add one value for each score the player will assign. The completed array should supply every Attribute score required by character creation.
attrgen.standard.info.specifics.elite=Elite Arrays provide a second, usually stronger or more exceptional, set of values. They use the same assignment mode as the Standard Array. You may leave this list empty if your game has only one fixed array.
attrgen.standard.info.specifics.default=Default Array Type identifies which completed array character generation should offer first. Choose Standard or Elite after entering the values, and remove individual entries when correcting or rebuilding a set.
attrgen.dice.info.specifics.title=Using Dice Rolling
attrgen.dice.info.specifics.enabled=This screen is active when at least one Player Option uses Dice Rolling. It defines the complete procedure used to generate Attribute values; the general Dice Options screen only determines which die sizes are available here.
attrgen.dice.info.specifics.sets=Number of Sets controls how many complete groups of Attribute results are generated. During character creation, the player chooses which generated set to use.
attrgen.dice.info.specifics.assignment=Roll Assignment determines whether generated values are locked to Attributes in their rolled order or assigned by the player. When rolls are assigned in order, Set Attribute Order defines the canonical first-to-last association. Player assignment lets each rolled value be used once and returned to the available set when cleared.
attrgen.dice.info.specifics.substitution=Dice Substitution optionally allows a player to replace a rolled Attribute result with a fixed value. Substitution Value is the replacement score and must fall within the shared Attribute Score Limits when those limits are configured. Max Substitutions limits how many times the player may use it during character creation.
attrgen.dice.substitution.range=Must be between {min} and {max}, matching the Attribute Score Limits.
attrgen.dice.info.specifics.terms=Dice Terms build the roll used for an Attribute result. Number of Rolls is the quantity of the selected die, Reroll Below repeats results lower than the threshold, and Drop lowest roll removes the lowest die before totaling the term. Add multiple terms when the procedure combines different groups of dice.
attrgen.dice.info.specifics.manage=Number of Sets, Roll Assignment, and Dice Substitution settings save automatically when changed. Add Dice Term opens a focused form and appends the completed term to the procedure. Review the displayed notation after each addition and remove any term that should not participate in the final roll.
attrgen.point.info.specifics.title=Using Point Buy
attrgen.point.info.specifics.enabled=This screen is active when at least one Player Option uses Point Buy. Point Buy gives players a controlled budget for shaping Attribute scores instead of accepting only predetermined or random results.
attrgen.point.info.specifics.budget=Base Points is the budget available during character creation. Minimum Points to Spend can require players to commit part or all of that budget before continuing, while a value of zero allows unused points to remain.
attrgen.point.info.specifics.categories=Point Buy can use one shared Base Points pool or separate pools for each Attribute Category. Category pools can be attached by the creator, or created as named slots that players assign one-to-one during character generation.
attrgen.point.info.specifics.bounds=Minimum Value and Maximum Value define the score range available during the purchase process. These bounds keep players from lowering or raising an Attribute beyond what the Point Buy method permits.
attrgen.point.info.specifics.post_racial=Max Value Post-Racial is the final cap after ancestry, species, race, or similar character-option adjustments are applied. Set it higher than the purchase maximum when those later bonuses are allowed to exceed the normal Point Buy limit.
attrgen.point.info.specifics.negative=Allow Negative Attributes determines whether Point Buy may produce scores below zero. Enable it only when negative scores have a defined meaning in your game and the rest of the rules can interpret them correctly.
attrgen.point.info.specifics.apply=Point Buy fields save automatically when changed. When Point Buy is a second Player Option step set to Spend from existing scores, the earlier step supplies the starting scores and this budget is used to adjust them.
hp.info.specifics.title=Using Hit Points
hp.info.specifics.method=HP Gain Method controls how characters receive Hit Points as they advance. Rolled uses the applicable Hit Point die, Average uses that die's average result, and Fixed grants the exact Fixed HP per Level value.
hp.info.specifics.rounding=Average Rounding determines how fractional average results are converted to whole Hit Points. It applies only to the Average method. Fixed HP per Level applies only to Fixed, and the screen disables fields that do not affect the selected method.
hp.info.specifics.minimum=Minimum HP per Level is the floor for a level's gain after the selected method and relevant modifiers are considered. Use it to prevent poor rolls or penalties from reducing advancement below the minimum your game allows.
hp.info.specifics.attribute=Attribute Modifier selects the Attribute whose modifier is added to Hit Point gains. Choose None when Hit Points are not affected by an Attribute. Allow Negative Attribute Modifier determines whether a penalty from the selected Attribute may reduce those gains.
hp.info.specifics.first_level=Max HP at First Level gives a new character the maximum result instead of rolling or averaging the first Hit Point die. First Level Bonus HP adds a separate fixed amount to the starting total.
hp.info.specifics.static=For a game with a static health track, select No Hit Point Gain and enter the complete starting total as Base Hit Points. GMRules stores this as the equivalent zero-gain progression so existing rulesets and descendant calculations remain compatible. Each change on this screen saves immediately.
armorclass.info.specifics.title=Using Armor Class
armorclass.info.specifics.base=Base Armor Class is the unmodified defensive value from which a character begins. Set it to the number an unarmored character would use before Attribute modifiers, worn armor, effects, or other bonuses are applied.
armorclass.info.specifics.attribute=AC Attribute optionally identifies the Attribute whose modifier contributes to Armor Class. Choose None for a fixed base with no inherent Attribute contribution, or select the capability your game uses for avoidance, reflexes, defense, or a similar concept.
armorclass.info.specifics.use=Character generation combines this rule with the selected Attribute's modifier and any Armor Class changes supplied by equipment. Both fields save when changed, so you can return later if the Attribute list or defensive model evolves.
currency.info.specifics.title=Using Currency
currency.info.specifics.system=A Currency entry represents one economic system used by the game. Currency Name identifies that system, while Base Denomination creates its value-one unit. Add separate currencies when the setting contains economies that do not share denominations or exchange values.
currency.info.specifics.denominations=Denominations are the named units within the selected currency. Their Value is measured relative to that currency's base denomination: a value of 1 equals one base unit, while larger or fractional values represent more or less purchasing value.
currency.info.specifics.selection=Select a currency from the list before adding or removing its denominations. The badge shows how many denominations it contains. Removing a currency also removes the economic structure that later character and equipment rules may reference.
currency.info.specifics.starting=Starting Money declares where a new character's funds come from. Base uses the shared Base Amount; Class uses values defined by character class; Trait uses applicable character-option adjustments; Hybrid allows the ruleset to combine shared and option-based sources.
currency.info.specifics.starting_currency=Starting Money Currency identifies which currency receives the starting amount. Changes to the method, amount, and currency save automatically. Later Class and Race editors provide their own starting-money values or modifiers when those methods are part of the game.
currency.info.specifics.system_name=The optional system name changes what this collection is called throughout the builder and ruleset. Use it when your game calls money, wealth, credits, resources, or other economic units by a different collective term.
effecttypes.info.specifics.title=Using Effect Types
effecttypes.info.specifics.purpose=Effect Types are reusable classifications for the rules snippets and conditions in your game. Examples might include Damage, Healing, Movement, Mental, Magical, or Environmental. Create types that help players and descendant applications understand what an effect does.
effecttypes.info.specifics.entries=Add Effect Type opens an editor for the type's name and description. The name becomes the selectable tag, while the description explains the shared meaning of effects placed in that category.
effecttypes.info.specifics.multiple=An Effect or Status may use more than one Effect Type, so the categories may overlap. A burning condition could be both Damage and Environmental, for example. Use combinations when they communicate real rule relationships rather than creating a unique type for every entry.
effecttypes.info.specifics.manage=Edit revises a type, Remove deletes it, and the optional system name changes what this collection is called throughout the ruleset. Create the major types before Effects and Statuses so they are available while those entries are being defined.
damagetypes.info.specifics.title=Using Damage Types
damagetypes.info.specifics.purpose=Damage Types identify the nature of harm in your game, such as Fire, Cold, Ballistic, Psychic, Radiant, or Poison. They provide a shared reference that later rules can use for descriptions, resistances, vulnerabilities, immunities, and automation.
damagetypes.info.specifics.entries=Add Damage Type opens an editor for its name and creator-written description. Explain what produces this damage, how it is understood in the setting, and any general behavior that applies whenever the type appears.
damagetypes.info.specifics.references=Effects, equipment, weapons, armor, and spells can reference these entries instead of repeating free-form damage labels. Define a type once, then select it wherever the same kind of damage is used.
damagetypes.info.specifics.manage=Edit revises the shared entry and Remove deletes it. Review dependent content before removing a type from an established ruleset. The optional system name lets your game use another collective term for this list.
statuses.info.specifics.title=Using Statuses
statuses.info.specifics.purpose=Statuses are persistent or reusable conditions that can be applied to characters, creatures, or other game subjects. Examples include Stunned, Hidden, Burning, Inspired, Injured, or Exhausted.
statuses.info.specifics.entries=Add Status opens an editor for its name, description, and Effect Types. The description should tell users what the condition means and how it changes play; the selected types classify the condition for organization and later automation.
statuses.info.specifics.relationships=A Status defines the condition itself, while an Effect describes a rule event or result that may apply that condition. Keeping the Status reusable allows many spells, skills, items, or other rules to refer to the same condition.
statuses.info.specifics.manage=Use Edit to change the shared definition and Remove only when the condition is no longer part of the game. The optional system name changes how this collection is labeled without changing its underlying role.
effects.info.specifics.title=Using Effects
effects.info.specifics.purpose=Effects are reusable pieces of rules content that describe a result, change, or consequence. Create an Effect once when the same behavior may be granted by several skills, spells, weapons, or other game elements.
effects.info.specifics.entries=Add Effect opens an editor for its name and creator-written description. Write the actionable rule in the description, including triggers, targets, values, duration, limits, or other details needed to apply it during play.
effects.info.specifics.types=Assign one or more Effect Types to classify the behavior. Select an optional Damage Type when the Effect causes a defined kind of harm. These references let descendant applications organize effects and connect them to other rules without relying only on wording.
effects.info.specifics.references=Skills, spells, and weapons can attach existing Effects, and their editors can create a new Effect without leaving the current workflow. Editing the shared Effect updates the definition those elements reference.
effects.info.specifics.manage=Remove deletes the reusable Effect, so review elements that may depend on it first. The optional system name lets your game use a different term for this collection.
equipment.info.specifics.title=Using Equipment
equipment.info.specifics.purpose=Equipment contains general carried, worn, consumed, or used items that are not better represented by a more specialized rules section. Examples include tools, supplies, kits, devices, clothing, and adventuring gear.
equipment.info.specifics.entries=Add Equipment opens an editor for the item's name and creator-written description. Explain what the item is, how it is used, and any limitations or rules that players need when selecting or carrying it.
equipment.info.specifics.weight=Weight records the item's encumbrance using the units defined in Weights & Measures. Use zero or leave the measurement minimal when your game does not track equipment weight.
equipment.info.specifics.damage=Damage Type is optional and should be selected only when the item's rules directly involve a defined kind of damage. General equipment without a damage relationship can leave it set to None.
equipment.info.specifics.manage=Edit revises the complete item and Remove deletes it from the ruleset. The optional system name changes the collective label used for this equipment list.
weapons.info.specifics.title=Using Weapons
weapons.info.specifics.entries=Add Weapon creates a selectable weapon definition. Give it a name and creator-written description covering its form, use, range or handling rules, restrictions, special qualities, and any other details not represented by the structured fields.
weapons.info.specifics.damage=Number of Rolls, Dice Sides, and Modifier form the weapon's basic damage expression. For example, 2 rolls of a 6-sided die with a +1 modifier represents 2d6+1. Select the Damage Type that classifies this harm.
weapons.info.specifics.weight=Weight uses the measurement units defined earlier and allows inventory or encumbrance systems to account for the weapon. A zero value can represent negligible weight or a game that does not track it.
weapons.info.specifics.effects=Effects attach reusable rules behavior to the weapon, such as applying a condition, moving a target, or triggering an additional consequence. Select existing Effects or create one from the editor when the weapon needs a new shared rule.
weapons.info.specifics.manage=Edit revises the complete weapon and Remove deletes it. Review character options and other rules that may grant or reference a weapon before removing it from an established ruleset.
skills.info.specifics.title=Using Skills
skills.info.specifics.progression=Skill Point Progression determines how many points characters receive as they advance. By Class uses the values defined on each Class; Fixed uses the shared Base Points per Level; Intelligence Modified applies the relevant Attribute modifier; Custom allows level-specific values.
skills.info.specifics.progression_controls=Minimum per Level places a floor on the award. Apply Intelligence Modifier controls whether that modifier participates, and Same at all levels uses one value throughout progression. Clear Same at all levels to enter different point awards for selected levels; progression changes save automatically.
skills.info.specifics.entries=Add Skill opens the full Skill editor. Name and Description identify what the Skill covers, Category organizes related Skills, and Related Attribute connects checks to the broad capability that supports them.
skills.info.specifics.rules=Trained Only marks a Skill that cannot be used normally without training. Armor Check Penalty records how armor interferes with the Skill. Trait Starting Money Modifier lets a Skill or trait-like selection adjust starting funds when the chosen Starting Money method uses those adjustments.
skills.info.specifics.restrictions=Class Restrictions and Race Restrictions limit which character options may access the Skill. Leave both lists empty for general availability. Effects attach reusable outcomes or rules behavior, and a new Effect can be created directly from the Skill editor.
skills.info.specifics.manage=Edit revises the Skill and Remove deletes it from the shared list. The optional system name changes what Skills are called throughout the ruleset.
spells.info.specifics.title=Using Spells
spells.info.specifics.entries=Add Spell opens an editor for a magical, supernatural, technological, or otherwise special ability. Name and creator-written Description explain what it does and provide any casting rules not captured by the structured fields.
spells.info.specifics.classification=Level represents the Spell's relative tier or access requirement. School is a creator-defined classification such as Evocation, Healing, Psionics, or Hacking; it remains flexible so the terminology can match your setting.
spells.info.specifics.timing=Casting Time states how long activation takes, Range states how far or where it can reach, and Duration states how long its result lasts. These are creator-written values so they can use the time and measurement vocabulary of your game.
spells.info.specifics.damage=Damage Type is optional and classifies the Spell's harm when applicable. Leave it set to None for utility, healing, defensive, or other Spells that do not cause a defined damage type.
spells.info.specifics.effects=Effects attach reusable rule results to the Spell. Add every Effect the Spell produces, or create a new Effect from the editor when the required behavior does not exist yet.
spells.info.specifics.manage=Edit revises the complete Spell and Remove deletes it. The optional system name changes what this collection is called throughout the ruleset.
pantheons.info.specifics.title=Using Pantheons
pantheons.info.specifics.purpose=Pantheons organize related Deities into the religious traditions, divine families, alliances, or rival groups used by your setting. A Deity can belong to more than one Pantheon when your mythology overlaps.
pantheons.info.specifics.entries=Enter a Pantheon Name and use Description to explain its origin, shared beliefs, relationships, and place in the world. Save creates the Pantheon; Edit loads an existing one back into these fields.
pantheons.info.specifics.membership=The Deities list assigns existing Deities to this Pantheon. Because the Deities screen comes next, you may save a Pantheon without members, create the Deities afterward, and then return here to complete its membership.
pantheons.info.specifics.manage=Cancel clears the current form without removing saved entries. Remove deletes the selected Pantheon, and the optional system name changes what this collection is called throughout the ruleset.
deities.info.specifics.title=Using Deities
deities.info.specifics.identity=Deity Name identifies the divine figure. Deity Type and Divine Rank let you record classifications such as ancestral spirit, demigod, greater deity, or any hierarchy used by your game.
deities.info.specifics.portfolio=Primary Portfolio states the Deity's principal area of influence, while Alignment records any moral, ethical, elemental, or factional outlook your rules use. Holy Symbol and Worship Style describe how followers recognize and honor the Deity.
deities.info.specifics.pantheons=Pantheons assigns the Deity to one or more groups created on the previous screen. Select every applicable Pantheon, or leave the list empty for an independent Deity.
deities.info.specifics.spells=Can grant spells determines whether worship of this Deity can provide spellcasting. Max Spell Level places an upper limit on the Spell levels the Deity may grant; set it to match the power and role you intend.
deities.info.specifics.description=Use Description for the Deity's mythology, goals, commandments, relationships, followers, or any rules that are not represented by the structured fields.
deities.info.specifics.manage=Save adds or updates the Deity, Cancel clears the current form, Edit reopens an entry, and Remove deletes it. The optional system name changes what this collection is called throughout the ruleset.
races.info.specifics.title=Using Races
races.info.specifics.entries=Add Race opens the Race editor. Give the option a Name and use Description to explain its people, species, ancestry, culture, physiology, or whatever character origin this element represents in your game.
races.info.specifics.traits=Racial Traits assigns Skills that characters receive from this Race. Select an existing Skill and add it, or create a new Skill from the editor when the required trait is not yet part of the ruleset.
races.info.specifics.attributes=Attribute Limits restrict the scores available to members of this Race. Select an Attribute and enter its minimum and maximum; add only the limits your rules require.
races.info.specifics.money=Race Starting Money Modifier adjusts the character's starting funds because of this Race. Use zero when Race has no effect, a positive value for additional money, or a negative value for a reduction.
races.info.specifics.manage=Save creates or updates the Race. Edit revises an existing entry, Remove deletes it, and the optional system name changes what this collection is called throughout the ruleset.
classes.info.specifics.title=Using Classes
classes.info.specifics.entries=Add Class opens the Class editor. Name and creator-written Description establish the Class's role, theme, abilities, advancement, and any rules not represented by the structured fields.
classes.info.specifics.core=Primary Attribute identifies the score most important to the Class. Hit Die and its Modifier define the die expression associated with Class-based health when your Hit Points rules use it.
classes.info.specifics.skills=Class Skills lists the Skills associated with this Class. Select existing Skills to add them, or create a new Skill from the editor when the Class requires one that does not yet exist.
classes.info.specifics.skill_points=Skill Points per Level controls how many points this Class provides for Skill advancement. Keep Same at all levels selected for one repeating value, or clear it to enter different Skill Point values for individual levels.
classes.info.specifics.requirements=Required Attributes set minimum scores a character must meet to select the Class. Choose an Attribute, enter the minimum score, and add each prerequisite your rules require.
classes.info.specifics.money=Class Starting Money overrides the general starting-money value for characters of this Class. Leave it at zero when your rules do not use a Class-specific amount.
classes.info.specifics.manage=Save creates or updates the Class. Edit revises an entry, Remove deletes it, and the optional system name changes what this collection is called. Done offers to download the completed ruleset.
