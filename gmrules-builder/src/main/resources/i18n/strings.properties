web.home.intro_ttrpg=A tabletop RPG is a shared story game where players create characters, explore imagined worlds, and use rules and dice to decide what happens.
web.home.intro_purpose=GMRules helps you turn your custom game's rules, options, and content into a portable file that can power a digital ecosystem for your creation.
web.home.intro_optional_sections=In the following screens, you will enter the details and descriptions for your game rules. Every section is optional, if your game doesn't use them or if you just don't want that level of complexity from this specific tool.
web.home.intro_application_suite=The description you enter here will be presented to users of the suite of applications designed to bring your game to life, from character generation to world building and campaign management. You make the rules, we make the tools.
