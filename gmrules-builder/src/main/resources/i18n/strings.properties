hp.title=Hit Points
hp.intro=Hit Points are a numerical measure of how much harm, strain, or danger a character can endure before suffering serious consequences. Depending on the game, they may represent physical health alone or a combination of injury, stamina, luck, resolve, and the ability to avoid a decisive blow.
hp.intro.play=Damage usually reduces Hit Points, while healing, rest, or other recovery restores them. Reaching zero commonly triggers an important game state such as unconsciousness, critical injury, dying, or death, but your rules determine the exact consequence. Hit Points can also be used for creatures, vehicles, objects, or any other element that can be damaged.
hp.intro.design=The amount of Hit Points available, how quickly they increase, and how easily they return strongly shape the feel of play. Large or rapidly growing totals support durable, heroic characters; smaller or mostly fixed totals make danger more immediate. This screen defines how characters begin and gain Hit Points so the descendant applications can calculate those totals consistently.
