attrgen.title=Attribute Generation
attrgen.intro=Attributes describe a character's fundamental capabilities\u2014the broad qualities that help define what they are naturally good or bad at. Common examples include Strength, Intelligence, Agility, or Charisma, but your game can use any qualities that fit its setting and rules. A political drama might emphasize Influence and Reputation, while a survival game might focus on Endurance, Awareness, and Resourcefulness.
attrgen.intro_values=An attribute usually has a score or value that represents the character's capability. That value can affect dice rolls, determine whether the character qualifies for an option, modify another statistic, or establish limits within the game. Higher does not have to mean better, and attributes do not have to work identically; the important part is deciding what each attribute represents and how its value affects play.
attrgen.intro_scope=Attributes should describe broad capabilities rather than individual actions. For example, Agility might influence many activities involving speed or coordination, while Lockpicking would usually be modeled as a more specific skill. Your game may use only a few broad attributes, many specialized attributes, or no attributes at all. Every part of this section is optional.
attrgen.intro_flow=Attribute setup is divided across the next six screens. First, Attribute Generation defines how players receive or choose their starting attribute scores, using methods such as dice rolling, point buy, standard arrays, or combinations of those methods. Next, Attribute Categories lets you create optional groups for organizing related attributes. Then, Attributes is where you define the attributes themselves, explain what they represent, assign them to categories, and configure their allowed values and mechanical effects.
attrgen.intro_detail_screens=The final three screens are data-entry screens for the generation methods used by your player options. Use them to define the actual standard arrays, dice procedures, and point-buy rules that characters will use. They come after Attributes because some entries may depend on the completed attribute list. Methods your game does not use can be left alone.
attrgen.intro_specifics_options=On this screen, you will define the ways players can generate their characters' Attribute scores. You are choosing the options players will see during character creation; the detailed rules for Standard Array/Base Scores, Dice Rolling, and Point Buy are entered on their later screens.
attrgen.intro_specifics_player_options=Player Options are alternative generation methods offered to the player. Give each option a clear name, such as 'Roll for Attributes,' 'Standard Array/Base Scores,' or 'Base Scores with Point Buy.' If you create more than one option, the player will choose between them during character creation. If there is only one, it will be used automatically.
attrgen.intro_specifics_first_step=The First Step establishes the character's initial Attribute scores. Standard Array/Base Scores gives the player prepared values to assign or a base for a hybrid method. Dice Rolling generates values using the dice rules you define. Point Buy gives the player a budget that can be spent to build their scores.
attrgen.intro_specifics_second_step=The optional Second Step combines another generation method with the first result. Add increases the first scores, Spend uses the first scores as a point-buy baseline, and Choose generates both results before the player selects which complete result to use. Standard Array/Base Scores is available only as the first step.
attrgen.intro_specifics_score_limits=Score Limits define the lowest and highest scores allowed for Attributes. Select 'All attributes use the same score limits' when every Attribute follows the same range. Leave it unselected when individual Attributes need different limits; those limits can be entered while creating each Attribute.
attrgen.intro_specifics_modifiers=Default Modifiers translate Attribute scores into the bonuses or penalties used during play. Select 'All attributes use the same modifier list' when every Attribute uses the same score-to-modifier progression. If different Attributes calculate modifiers differently, leave it unselected and define their modifier lists individually on the Attributes screen.
