splash.description=Un jeu de r\u00f4le sur table (JdR) est un jeu d\u2019histoire partag\u00e9e o\u00f9 les joueurs cr\u00e9ent des personnages et utilisent des r\u00e8gles et des d\u00e9s pour d\u00e9cider ce qui se passe. Cette application vous permet de saisir les r\u00e8gles et les \u00e9l\u00e9ments d\u2019un jeu afin qu\u2019ils puissent \u00eatre utilis\u00e9s dans la suite d\u2019applications GameMaker.
