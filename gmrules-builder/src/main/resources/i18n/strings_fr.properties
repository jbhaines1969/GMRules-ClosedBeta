measurements.title=Poids et mesures
measurements.intro=Choisissez le syst\u00e8me de mesure que votre jeu utilisera par d\u00e9faut : m\u00e9trique ou imp\u00e9rial (unit\u00e9s usuelles am\u00e9ricaines).
measurements.intro_time_units=Sur cet \u00e9cran, vous saisirez \u00e9galement les unit\u00e9s de temps utilis\u00e9es pour diff\u00e9rentes actions et diff\u00e9rents \u00e9v\u00e9nements du jeu. L'ensemble standard est inclus; vous pouvez supprimer les unit\u00e9s inutilis\u00e9es et ajouter celles dont votre jeu a besoin. Un round correspond g\u00e9n\u00e9ralement au temps n\u00e9cessaire pour effectuer une action simple, tandis qu'un tour correspond plut\u00f4t au temps n\u00e9cessaire pour des op\u00e9rations plus complexes. Ajoutez-en autant que vous le souhaitez; toute unit\u00e9 devenue inutile pourra toujours \u00eatre supprim\u00e9e ou ignor\u00e9e.
