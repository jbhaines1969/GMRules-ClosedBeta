defense.info.specifics.title=Utiliser la d\u00e9fense
defense.info.specifics.modes=La valeur passive fournit un nombre d\u00e9fensif fixe. Le jet actif g\u00e9n\u00e8re un r\u00e9sultat distinct. L'ajustement d'attaque modifie sa g\u00e9n\u00e9ration. Aucune d\u00e9fense de pr\u00e9cision signifie que le contact n'est pas emp\u00each\u00e9 \u00e0 cette \u00e9tape.
defense.info.specifics.active=Les jets actifs peuvent produire un total additif, un r\u00e9sultat sous une cible ou un nombre de succ\u00e8s. Un nombre de d\u00e9s fixe est final; une r\u00e9serve de base peut \u00eatre modifi\u00e9e plus tard.
defense.info.specifics.modifier=Les ajustements d'attaque peuvent appliquer un modificateur fixe, ajouter des d\u00e9s de difficult\u00e9, retirer des d\u00e9s, imposer un d\u00e9savantage ou ajuster un seuil de succ\u00e8s.
defense.info.specifics.boundary=La g\u00e9n\u00e9ration de la d\u00e9fense s'arr\u00eate avant la comparaison et les d\u00e9g\u00e2ts. La R\u00e9solution d'attaque g\u00e8re la comparaison, les \u00e9galit\u00e9s et les r\u00e9sultats; les \u00e9tapes suivantes g\u00e8rent les parades, r\u00e9actions, absorptions, armures et dommages.
attackresolution.info.specifics.title=Utiliser la r\u00e9solution d'attaque
attackresolution.info.specifics.modes=La r\u00e9solution peut comparer une attaque \u00e0 une d\u00e9fense passive, comparer deux r\u00e9sultats g\u00e9n\u00e9r\u00e9s, comparer uniquement le d\u00e9fenseur \u00e0 une menace ou rendre le contact automatique.
attackresolution.info.specifics.comparison=La m\u00e9thode de comparaison d\u00e9finit quel c\u00f4t\u00e9 gagne num\u00e9riquement. L'option L'attaquant gagne en cas d'\u00e9galit\u00e9 d\u00e9termine si l'\u00e9galit\u00e9 est incluse; lorsqu'elle est d\u00e9sactiv\u00e9e, l'\u00e9galit\u00e9 favorise le d\u00e9fenseur. Les plages remplacent un simple succ\u00e8s ou \u00e9chec par des r\u00e9sultats fond\u00e9s sur l'attaque, la d\u00e9fense ou la marge.
attackresolution.info.specifics.routes=Chaque attaque non automatique choisit une route de source par identifiant stable. Une route peut d\u00e9signer la M\u00e9thode d'attaque, une carte, un attribut, une comp\u00e9tence, un objet ou une autre source.
attackresolution.info.specifics.boundary=Cet \u00e9cran r\u00e9sout le contact initial ou un autre r\u00e9sultat nomm\u00e9. Il ne calcule pas les d\u00e9g\u00e2ts, l'absorption, l'armure, les co\u00fbts de parade, les r\u00e9actions ou les dommages ult\u00e9rieurs.
