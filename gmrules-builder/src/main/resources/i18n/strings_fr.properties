dice.intro=Dans les JdR, les jets de d\u00e9s servent souvent \u00e0 cr\u00e9er des personnages, randomiser des choix, ou r\u00e9soudre des situations. Votre attaque r\u00e9ussit-elle ? Combien de d\u00e9g\u00e2ts ce sort inflige-t-il ? Quels tr\u00e9sors se trouvent dans le butin du dragon, ou dans le coffre du PDG ? S\u00e9lectionnez les d\u00e9s utilis\u00e9s par votre syst\u00e8me de jeu et ajoutez les plages personnalis\u00e9es n\u00e9cessaires.
