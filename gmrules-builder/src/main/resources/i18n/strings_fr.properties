attrtypes.intro=Les cat\u00e9gories d'attributs sont des groupes optionnels, pas les attributs eux-m\u00eames. Par exemple, Vampire: The Masquerade regroupe les attributs en Physique, Social et Mental, tandis que de nombreuses versions de D\u0026D n'utilisent pas de cat\u00e9gories.
