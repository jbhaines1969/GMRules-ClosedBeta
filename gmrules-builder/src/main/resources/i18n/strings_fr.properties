web.home.intro_ttrpg=Un jeu de r\u00f4le sur table est un jeu d'histoire partag\u00e9e o\u00f9 les joueurs cr\u00e9ent des personnages, explorent des mondes imaginaires, et utilisent des r\u00e8gles et des d\u00e9s pour d\u00e9cider ce qui se passe.
web.home.intro_purpose=GMRules vous aide \u00e0 transformer les r\u00e8gles, options, et contenus de votre jeu personnalis\u00e9 en un fichier portable qui peut alimenter un \u00e9cosyst\u00e8me num\u00e9rique pour votre cr\u00e9ation.
web.home.intro_optional_sections=Dans les \u00e9crans suivants, vous saisirez les d\u00e9tails et les descriptions des r\u00e8gles de votre jeu. Chaque section est facultative si votre jeu ne l'utilise pas ou si vous ne souhaitez pas ce niveau de complexit\u00e9 dans cet outil.
web.home.intro_application_suite=La description que vous saisissez ici sera pr\u00e9sent\u00e9e aux utilisateurs de la suite d'applications con\u00e7ue pour donner vie \u00e0 votre jeu, de la cr\u00e9ation de personnages \u00e0 la construction de mondes et \u00e0 la gestion de campagnes. Vous cr\u00e9ez les r\u00e8gles, nous cr\u00e9ons les outils.
