attrgen.title=G\u00e9n\u00e9ration des attributs
attrgen.intro=Les attributs d\u00e9crivent les capacit\u00e9s fondamentales d'un personnage : les grandes qualit\u00e9s qui permettent de d\u00e9finir ses forces et ses faiblesses naturelles. Parmi les exemples courants figurent la Force, l'Intelligence, l'Agilit\u00e9 ou le Charisme, mais votre jeu peut utiliser toutes les qualit\u00e9s adapt\u00e9es \u00e0 son univers et \u00e0 ses r\u00e8gles. Un drame politique pourrait mettre l'accent sur l'Influence et la R\u00e9putation, tandis qu'un jeu de survie pourrait privil\u00e9gier l'Endurance, la Vigilance et l'Ing\u00e9niosit\u00e9.
attrgen.intro_values=Un attribut poss\u00e8de g\u00e9n\u00e9ralement un score ou une valeur qui repr\u00e9sente la capacit\u00e9 du personnage. Cette valeur peut influencer les jets de d\u00e9s, d\u00e9terminer si le personnage remplit les conditions d'une option, modifier une autre statistique ou \u00e9tablir des limites dans le jeu. Une valeur plus \u00e9lev\u00e9e n'est pas obligatoirement meilleure, et les attributs ne doivent pas tous fonctionner de la m\u00eame mani\u00e8re; l'essentiel est de d\u00e9cider ce que repr\u00e9sente chaque attribut et comment sa valeur influence le jeu.
attrgen.intro_scope=Les attributs doivent d\u00e9crire des capacit\u00e9s g\u00e9n\u00e9rales plut\u00f4t que des actions individuelles. Par exemple, l'Agilit\u00e9 peut influencer de nombreuses activit\u00e9s li\u00e9es \u00e0 la vitesse ou \u00e0 la coordination, tandis que le Crochetage serait g\u00e9n\u00e9ralement repr\u00e9sent\u00e9 par une comp\u00e9tence plus pr\u00e9cise. Votre jeu peut utiliser quelques attributs g\u00e9n\u00e9raux, de nombreux attributs sp\u00e9cialis\u00e9s ou aucun attribut. Chaque partie de cette section est facultative.
attrgen.intro_flow=La configuration des attributs est r\u00e9partie sur les six prochains \u00e9crans. Tout d'abord, G\u00e9n\u00e9ration des attributs d\u00e9finit comment les joueurs re\u00e7oivent ou choisissent leurs scores d'attribut de d\u00e9part, \u00e0 l'aide de m\u00e9thodes telles que les jets de d\u00e9s, l'achat de points, les tableaux standards ou une combinaison de ces m\u00e9thodes. Ensuite, Cat\u00e9gories d'attributs permet de cr\u00e9er des groupes facultatifs pour organiser les attributs associ\u00e9s. Puis, Attributs permet de d\u00e9finir les attributs eux-m\u00eames, d'expliquer ce qu'ils repr\u00e9sentent, de les associer \u00e0 des cat\u00e9gories et de configurer leurs valeurs autoris\u00e9es ainsi que leurs effets m\u00e9caniques.
attrgen.intro_detail_screens=Les trois derniers \u00e9crans servent \u00e0 saisir les donn\u00e9es des m\u00e9thodes de g\u00e9n\u00e9ration utilis\u00e9es par vos options de joueur. Ils permettent de d\u00e9finir les tableaux standards, les proc\u00e9dures de jets de d\u00e9s et les r\u00e8gles d'achat de points que les personnages utiliseront. Ces \u00e9crans viennent apr\u00e8s Attributs, car certaines donn\u00e9es peuvent d\u00e9pendre de la liste d'attributs termin\u00e9e. Les m\u00e9thodes que votre jeu n'utilise pas peuvent \u00eatre laiss\u00e9es de c\u00f4t\u00e9.
attrgen.intro_specifics=Les instructions propres \u00e0 la g\u00e9n\u00e9ration des attributs seront ajout\u00e9es ici
